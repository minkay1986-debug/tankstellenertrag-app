    .main{padding:16px!important}.modern-title{font-size:27px}.modern-hero{padding:19px;border-radius:16px}
    .modern-kpi-wrap{grid-template-columns:1fr 1fr}.modern-kpi{padding:14px}.modern-kpi .mk-value{font-size:23px}
    .modern-radar{grid-template-columns:1fr}
  }
  @media(max-width:390px){
    .modern-kpi-wrap{grid-template-columns:1fr}.modern-title{font-size:25px}
  }
  `;

  function esc(s){
    return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function euro(n){
    return Number(n||0).toLocaleString('de-DE',{minimumFractionDigits:0,maximumFractionDigits:0})+' €';
  }
  function pct(n){
    return Number(n||0).toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})+' %';
  }
  function getData(w){
    try{return JSON.parse(w.localStorage.getItem('tse_current')||'null')}catch(e){return null}
  }
  function months(data){
    return Object.keys(data?.months||{}).sort().filter(k=>{
      const x=data.months[k]||{};
      return Number(x.revenue||0)>0 || Number(x.ek||0)>0 || Number(x.shrink||0)>0 ||
        Number(x.writeoff||0)>0 || Object.values(x.groups||{}).some(g=>Number(g?.revenue||0)>0);
    }).slice(-12);
  }
  function monthLabel(k){
    const p=String(k).split('-'); if(p.length<2)return k;
    return new Date(Number(p[0]),Number(p[1])-1,1).toLocaleDateString('de-DE',{month:'short'}).replace('.','');
  }
  function calcMonth(data,k){
    const x=data?.months?.[k]||{};
    const revenue=Number(x.revenue||0);
    const ek=Number(x.ek||0);
    return {revenue,ek,gross:revenue-ek,margin:revenue?(revenue-ek)/revenue*100:0,shrink:Number(x.shrink||0),writeoff:Number(x.writeoff||0),stock:Number(x.stock||0)};
  }
  function pathFor(vals,w,h,pad, max){
    if(!vals.length)return '';
    const iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
    return vals.map((v,i)=>{
      const x=pad.l+(vals.length===1?iw/2:iw*i/(vals.length-1));
      const y=pad.t+ih-(Number(v||0)/max)*ih;
      return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);
    }).join(' ');
  }
  function lineChart(data){
    const ms=months(data), vals=ms.map(k=>calcMonth(data,k).revenue), max=Math.max(...vals,1)*1.12,w=720,h=245,pad={l:8,r:8,t:18,b:28};
    if(!ms.length)return '<div class="modern-empty">Noch keine Monatsdaten vorhanden.<br>Sobald Daten vorliegen, erscheint hier die Umsatzentwicklung.</div>';
    const path=pathFor(vals,w,h,pad,max), ih=h-pad.t-pad.b;
    const points=vals.map((v,i)=>{const x=pad.l+(vals.length===1?(w-pad.l-pad.r)/2:(w-pad.l-pad.r)*i/(vals.length-1));const y=pad.t+ih-(v/max)*ih;return [x,y,v]});
    const grid=[0.25,.5,.75,1].map(r=>{const y=pad.t+ih-(ih*r);return '<line x1="'+pad.l+'" y1="'+y+'" x2="'+(w-pad.r)+'" y2="'+y+'" stroke="rgba(255,255,255,.055)" />'}).join('');
    const dots=points.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.2" fill="#ff7a1a" stroke="#0d1316" stroke-width="2"><title>'+euro(p[2])+'</title></circle>').join('');
    const labels=ms.map((k,i)=>{const x=points[i][0];return '<text x="'+x+'" y="'+(h-7)+'" text-anchor="middle" fill="#6f7b82" font-size="10">'+esc(monthLabel(k))+'</text>'}).join('');
    return '<svg class="modern-svg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><defs><linearGradient id="teLineFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ff7a1a" stop-opacity=".22"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></linearGradient></defs>'+grid+'<path d="'+path+' L '+points[points.length-1][0]+' '+(pad.t+ih)+' L '+points[0][0]+' '+(pad.t+ih)+' Z" fill="url(#teLineFill)"/><path d="'+path+'" fill="none" stroke="#ff7a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+dots+labels+'</svg>';
  }
  function groupChart(data){
    const k=Object.keys(data?.months||{}).sort().slice(-1)[0];
    const x=data?.months?.[k]||{}, groups=x.groups||{}, settings=data?.settings||{};
    const defs=[['süsswaren','Süßwaren',50],['backshop','Backshop',59.2],['kaffee','Kaffee',55],['drogerie','Drogerie',50],['lebensmittel','Lebensmittel',50],['spielzeug','Spielzeug',45],['waschen','Waschen',0],['getraenke','Getränke',50],['eis','Eis',56.8]];
    const items=defs.filter(g=>Number(groups[g[0]]?.revenue||0)>0).slice(0,6).map(g=>{
      const q=groups[g[0]]||{},rev=Number(q.revenue||0),ek=Number(q.ek||0);
      const actual=rev>0&&ek>0?(rev-ek)/rev*100:null;
      const target=Number(settings?.targetMargins?.[g[0]]??g[2]);
      return {name:g[1],actual,target};
    });
    if(!items.length)return '<div class="modern-empty">Für die aktuelle Monatsauswertung sind noch keine<br>Warengruppen-Umsätze hinterlegt.</div>';
    const w=720,h=Math.max(245,items.length*42+28),left=112,right=58,top=18,bottom=12,iw=w-left-right,rowH=(h-top-bottom)/items.length;
    const rows=items.map((it,i)=>{
      const y=top+i*rowH+rowH/2,track=iw,max=100;
      const actualW=it.actual==null?0:Math.max(0,Math.min(100,it.actual))/max*track;
      const targetX=left+Math.max(0,Math.min(100,it.target))/max*track;
      const good=it.actual!=null&&it.actual>=it.target;
      const value=it.actual==null?'—':Number(it.actual).toFixed(1)+'%';
      return '<text x="'+(left-12)+'" y="'+(y+4)+'" text-anchor="end" fill="#c4cdd2" font-size="11" font-weight="700">'+esc(it.name)+'</text>'+
        '<rect x="'+left+'" y="'+(y-7)+'" width="'+track+'" height="14" rx="7" fill="rgba(255,255,255,.055)"/>'+
        '<rect x="'+left+'" y="'+(y-7)+'" width="'+actualW+'" height="14" rx="7" fill="'+(good?'#4bd487':'#f06b67')+'" opacity=".92"/>'+
        '<line x1="'+targetX+'" y1="'+(y-11)+'" x2="'+targetX+'" y2="'+(y+11)+'" stroke="#aab5bb" stroke-width="2" stroke-linecap="round"/>'+
        '<text x="'+(w-8)+'" y="'+(y+4)+'" text-anchor="end" fill="'+(good?'#75dfa2':'#ff8b87')+'" font-size="11" font-weight="900">'+value+'</text>';
    }).join('');
    return '<div class="group-legend"><span><i class="legend-dot good"></i>Ist-Marge</span><span><i class="legend-mark"></i>Zielmarge</span></div><svg class="modern-svg group-svg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+rows+'</svg>';
  }
  function radarSignals(data){
    const k=Object.keys(data?.months||{}).sort().slice(-1)[0],d=calcMonth(data,k),out=[];
    if(d.revenue&&d.shrink/d.revenue*100>=1)out.push('<div class="modern-signal warn"><b>Schwundquote prüfen</b><span>'+pct(d.shrink/d.revenue*100)+' · Bestandsdifferenz genauer untersuchen</span></div>');
    if(d.writeoff>0)out.push('<div class="modern-signal warn"><b>Abschriften / MHD</b><span>'+euro(d.writeoff)+' · Ursachen und Artikel prüfen</span></div>');
    if(d.stock&&d.revenue&&d.stock/d.revenue*100>20)out.push('<div class="modern-signal warn"><b>Lagerbestand prüfen</b><span>'+pct(d.stock/d.revenue*100)+' Bestandsquote · Überbestand ausschließen</span></div>');
    if(!out.length)out.push('<div class="modern-signal good"><b>Aktuell keine auffällige Kennzahl</b><span>Die vorhandenen Daten zeigen derzeit keinen priorisierten Warnhinweis.</span></div>');
    return out.slice(0,4).join('');
  }
  function buildModern(doc,w){
    if(doc.getElementById('modernDesignLayer'))return;
    const dash=doc.getElementById('dashboard'); if(!dash)return;
    const data=getData(w);
    const ms=months(data);
    const latest=ms.at(-1);
    const previous=ms.length>1?ms.at(-2):null;
    const d=latest?calcMonth(data,latest):{revenue:0,margin:0,shrink:0,writeoff:0,stock:0,gross:0};
    const p=previous?calcMonth(data,previous):null;
    const delta=(a,b)=>b&&b!==0?(a-b)/b*100:null;
    const revDelta=delta(d.revenue,p?.revenue), grossDelta=delta(d.gross,p?.gross);
    const layer=doc.createElement('div');layer.id='modernDesignLayer';
    const deltaHtml=(v)=>v==null?'—':(v>=0?'▲ ':'▼ ')+Math.abs(v).toLocaleString('de-DE',{maximumFractionDigits:1})+' %';
    const deltaClass=(v)=>v==null?'neutral':v>=0?'positive':'negative';
    const health=d.margin>=30?'Sehr gut':d.margin>=20?'Stabil':'Prüfen';
    const healthClass=d.margin>=30?'good':d.margin>=20?'mid':'bad';
    layer.innerHTML=
      '<section class="premium-hero">'+
        '<div class="hero-copy"><div class="modern-kicker">TankstellenErtrag · Executive Dashboard</div>'+
        '<h1>Ihr Ertrag.<br><span>Auf einen Blick.</span></h1>'+
        '<p>Die wichtigsten Entwicklungen Ihrer Station – klar priorisiert, visuell aufbereitet und direkt aus den vorhandenen Stationsdaten.</p>'+
        '<div class="hero-meta"><span class="live-dot"></span><b>Aktueller Datenstand</b><span>'+esc(latest||'Noch kein Monat')+'</span><span class="hero-sep">•</span><span>keine neuen Eingaben erforderlich</span></div></div>'+
        '<div class="health-card '+healthClass+'"><div class="health-ring"><span>'+Number(d.margin||0).toFixed(0)+'<small>%</small></span></div><div><div class="health-label">Ertragsstatus</div><strong>'+health+'</strong><p>Shop-Marge aktuell</p></div></div>'+
      '</section>'+
      '<section class="premium-kpis">'+
        '<article class="premium-kpi accent-orange"><div class="kpi-top"><span>Shop-Umsatz</span><span class="kpi-icon">↗</span></div><strong>'+euro(d.revenue)+'</strong><div class="kpi-bottom"><span class="'+deltaClass(revDelta)+'">'+deltaHtml(revDelta)+'</span><span>zum Vormonat</span></div></article>'+
        '<article class="premium-kpi accent-green"><div class="kpi-top"><span>Rohertrag</span><span class="kpi-icon">€</span></div><strong>'+euro(d.gross)+'</strong><div class="kpi-bottom"><span class="'+deltaClass(grossDelta)+'">'+deltaHtml(grossDelta)+'</span><span>zum Vormonat</span></div></article>'+
        '<article class="premium-kpi accent-yellow"><div class="kpi-top"><span>Shop-Marge</span><span class="kpi-icon">%</span></div><strong>'+pct(d.margin)+'</strong><div class="kpi-bottom"><span class="neutral">Warenergebnis</span><span>Umsatz minus EK</span></div></article>'+
        '<article class="premium-kpi accent-red"><div class="kpi-top"><span>Schwund</span><span class="kpi-icon">!</span></div><strong>'+euro(d.shrink)+'</strong><div class="kpi-bottom"><span class="neutral">'+(d.revenue?pct(d.shrink/d.revenue*100):'0 %')+'</span><span>vom Umsatz</span></div></article>'+
      '</section>'+
      '<section class="premium-grid">'+
        '<article class="premium-card chart-main"><div class="premium-head"><div><span class="eyebrow">ENTWICKLUNG</span><h2>Umsatz im Zeitverlauf</h2><p>Letzte verfügbare Monate · echte Stationsdaten</p></div><span class="chart-chip">12 Monate</span></div>'+lineChart(data)+'</article>'+
        '<article class="premium-card chart-side"><div class="premium-head"><div><span class="eyebrow">WARENGRUPPEN</span><h2>Marge im Vergleich</h2><p>Ist-Marge gegenüber Zielmarge</p></div></div>'+groupChart(data)+'</article>'+
      '</section>'+
      '<section class="premium-card radar-card"><div class="premium-head"><div><span class="eyebrow">ERTRAGSRADAR</span><h2>Was sollten Sie sich ansehen?</h2><p>Priorisierte Signale aus den vorhandenen Daten – Hinweise, keine erfundenen Ursachen.</p></div><span class="radar-chip">PRÜFEN · NICHT BEWEISEN</span></div><div class="premium-radar">'+radarSignals(data)+'</div></section>'+
      '<section class="premium-actions"><article><span>01</span><div><b>Erkennen</b><p>Abweichungen zuerst dort prüfen, wo Umsatz, Marge oder Schwund auffällig sind.</p></div></article><article><span>02</span><div><b>Einordnen</b><p>Warengruppe und Entwicklung gemeinsam betrachten – nicht nur eine einzelne Kennzahl.</p></div></article><article><span>03</span><div><b>Handeln</b><p>Konkrete Maßnahmen erst nach der Ursachenprüfung ableiten.</p></div></article></section>';
    dash.insertBefore(layer,dash.firstChild);
  }
  function inject(){
    const doc=frame.contentDocument,w=frame.contentWindow;
    if(!doc||!doc.head)return;
    if(!doc.getElementById('modernTestCSS')){
      const s=doc.createElement('style');s.id='modernTestCSS';s.textContent=modernCSS;doc.head.appendChild(s);
    }
    const start=Date.now();
    const timer=setInterval(()=>{
      buildModern(doc,w);
      const app=doc.getElementById('app');
      if(app&&app.style.display!=='none')clearInterval(timer);
      if(Date.now()-start>15000)clearInterval(timer);
    },350);
    try{
      // Kein dynamisches Hochsetzen der iframe-Höhe: verhindert das kontinuierliche Verschieben der Testseite.
      frame.style.height='calc(100vh - 34px)';
      frame.style.minHeight='760px';
    }catch(e){}
    w.addEventListener('click',()=>setTimeout(()=>buildModern(doc,w),250),true);
    w.addEventListener('storage',()=>setTimeout(()=>{const old=doc.getElementById('modernDesignLayer');if(old)old.remove();buildModern(doc,w)},250));
  }
  frame.addEventListener('load',inject);
})();
</script>
