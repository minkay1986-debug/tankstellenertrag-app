name = "tankstellenertrag-advisor-ai-test"
main = "src/index.js"
compatibility_date = "2026-11-03"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "USER_QUOTAS"
class_name = "DailyQuota"

[[durable_objects.bindings]]
name = "GLOBAL_QUOTA"
class_name = "DailyQuota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DailyQuota"]

[vars]
GLOBAL_DAILY_LIMIT = "250"
