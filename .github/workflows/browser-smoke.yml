name: Browser smoke tests
on:
  push:
    branches:
      - test/live-copy-2026-10-13
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright test runner
        run: |
          npm init -y
          npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests against isolated repository copy
        run: npx playwright test
      - name: Upload public landing screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-page-browser-screenshots
          path: test-results/*.png
          if-no-files-found: warn
          retention-days: 7
