name: TankstellenErtrag News

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"
  push:
    paths:
      - "scripts/build_news.py"
      - "news.html"
      - ".github/workflows/news-automation.yml"

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[news-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build news
        run: python scripts/build_news.py

      - name: Add News link to landing page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          if 'href="./news.html"' not in s:
              s=s.replace('<a href="#wissen">Branchenwissen</a>', '<a href="#wissen">Branchenwissen</a><a href="./news.html">News</a>')
              p.write_text(s,encoding="utf-8")
          PY

      - name: Commit generated news
        run: |
          git config user.name "TankstellenErtrag News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add news news.html news-sitemap.xml index.html
          if git diff --cached --quiet; then
            echo "Keine neuen Meldungen."
            exit 0
          fi
          git commit -m "chore: update Tankstellen news [news-bot]"
          git push
