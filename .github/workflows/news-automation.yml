name: TankstellenErtrag News

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build news
        run: python scripts/build_news.py

      - name: Add News link to landing page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          if 'href="./news.html"' not in s:
              s = s.replace(
                  '<a href="#wissen">Branchenwissen</a>',
                  '<a href="#wissen">Branchenwissen</a><a href="./news.html">News</a>'
              )
              p.write_text(s, encoding="utf-8")
          PY

      - name: Create or update News pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/news-updates
          delete-branch: true
          commit-message: "chore: update Tankstellen news [news-bot]"
          title: "Automatische TankstellenErtrag-News aktualisieren"
          body: |
            Dieser Pull Request wurde automatisch durch den TankstellenErtrag-News-Workflow erstellt.

            - Neue Branchenmeldungen und News-Seiten
            - Aktualisierte News-Sitemap
            - News-Link auf der Startseite, falls noch nicht vorhanden

            Bitte die erforderlichen Statusprüfungen abwarten und anschließend prüfen/mergen.
