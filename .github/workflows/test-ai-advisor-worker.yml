name: AI advisor worker tests

on:
  push:
    branches:
      - feature/ai-advisor-chat-pilot-2026-11-03
    paths:
      - "ai-advisor-worker/**"
      - ".github/workflows/test-ai-advisor-worker.yml"
  pull_request:
    paths:
      - "ai-advisor-worker/**"
      - ".github/workflows/test-ai-advisor-worker.yml"

jobs:
  quota-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-advisor-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
