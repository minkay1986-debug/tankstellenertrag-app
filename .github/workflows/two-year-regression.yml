name: Two-year regression test
on:
  push:
    branches:
      - test/live-copy-2026-10-13
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate 2025 and 2026 fixture against current analysis source
        run: node tests/two-year-regression.test.mjs
      - name: Execute real calculation functions from analyse.html against both years
        run: node tests/two-year-app-calculation.test.mjs
      - name: Render the real monthly report against fixture data
        run: node tests/two-year-report-render.test.mjs
      - name: Execute real analysis signals and data quality checks
        run: node tests/two-year-analysis-signals.test.mjs
      - name: Render article diagnostics with known test values
        run: node tests/two-year-article-diagnostics.test.mjs
      - name: Render Mein Monat page against controlled month values
        run: node tests/two-year-meinmonat-render.test.mjs
      - name: Verify yearly overview reacts to changed monthly values
        run: node tests/two-year-yearly-reactivity.test.mjs
      - name: Verify dashboard trend chart reacts to changed monthly values
        run: node tests/two-year-chart-reactivity.test.mjs
