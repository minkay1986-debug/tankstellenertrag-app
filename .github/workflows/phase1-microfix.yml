name: Phase1 microfix
on:
  push:
    branches:
      - feature/mein-monat-phase1
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Phase 1 microfix: mobile KPI and margin display'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Mein Monat presentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("analyse.html")
          c=p.read_text()
          old="pct(Math.abs(marginChange))+' %-Pkt. zum Vormonat'"
          new="Math.abs(marginChange).toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})+' %-Pkt. zum Vormonat'"
          if old not in c:
              raise SystemExit("margin display pattern not found")
          c=c.replace(old,new,1)
          marker=".meinmonat-kpis{grid-template-columns:repeat(4,1fr)}"
          repl=marker+"@media(max-width:1100px){.meinmonat-kpis{grid-template-columns:repeat(2,1fr)}}"
          if marker not in c:
              raise SystemExit("mobile marker not found")
          c=c.replace(marker,repl,1)
          p.write_text(c)
          PY
      - name: Commit microfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analyse.html
          git commit -m "Phase 1 microfix: mobile KPI and margin display"
          git push
