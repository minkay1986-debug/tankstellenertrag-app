name: Cloudflare AI Prototype Tests

on:
  push:
    branches: ["test/ai-advisor-prototype-2026-10-24"]
    paths:
      - "prototypes/cloudflare-workers-ai/**"
      - "prototypes/warengruppen-fachberater/knowledge-base.json"
      - ".github/workflows/cloudflare-ai-prototype-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "prototypes/cloudflare-workers-ai/**"
      - ".github/workflows/cloudflare-ai-prototype-tests.yml"
      - "docs/AI-ADVISOR-TESTBRANCH.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype-tests:
    name: Isolated AI prototype safety tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/cloudflare-workers-ai
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run unit tests (no provider credentials or network calls)
        run: npm test
