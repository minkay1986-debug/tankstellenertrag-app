name: TankstellenErtrag Studienwissen

on:
  workflow_dispatch:
  schedule:
    - cron: "35 6 * * *"
  push:
    paths:
      - "scripts/build_studies.py"
      - ".github/workflows/study-automation.yml"

permissions:
  contents: write

jobs:
  update-studies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build study knowledge
        run: python scripts/build_studies.py

      - name: Commit study knowledge
        run: |
          git config user.name "TankstellenErtrag Study Bot"
          git config user.email "actions@users.noreply.github.com"
          git add studien
          if git diff --cached --quiet; then
            echo "Keine Änderungen im Studienwissen."
            exit 0
          fi
          git commit -m "chore: update industry study knowledge [study-bot]"
          git push
