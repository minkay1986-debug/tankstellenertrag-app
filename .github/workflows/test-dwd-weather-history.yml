name: Test DWD weather history

on:
  pull_request:
    paths:
      - "supabase/functions/dwd-weather-history/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check DWD history function
        run: deno check supabase/functions/dwd-weather-history/index.ts
      - name: Run DWD history handler tests
        run: deno test --allow-net supabase/functions/dwd-weather-history/index.test.ts
