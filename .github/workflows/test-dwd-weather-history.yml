name: Test DWD weather history

on:
  pull_request:
    paths:
      - "supabase/functions/dwd-weather-history/**"
      - "ertragsoptimierer.js"
      - "ertragsoptimierer.test.ts"
      - "analyse.html"
      - "two-year-regression.test.ts"
      - "admin-error-reports.test.ts"
      - "supabase/migrations/20261014190000_admin_app_error_reports.sql"
      - "index.html"
      - ".github/workflows/test-dwd-weather-history.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check function and optimizer tests
        run: deno check supabase/functions/dwd-weather-history/index.ts ertragsoptimierer.test.ts
      - name: Run optimizer unit tests
        run: deno test ertragsoptimierer.test.ts
      - name: Type-check and run admin error-report security contract tests (RPC assertion corrected)
        run: deno check admin-error-reports.test.ts && deno test --allow-read=index.html,supabase/migrations/20261014190000_admin_app_error_reports.sql admin-error-reports.test.ts
      - name: Run two-year analysis, margin-alert and partial-year regression tests
        run: deno test --allow-read=analyse.html two-year-regression.test.ts
      - name: Run handler tests and real DWD integration test
        run: deno test --allow-net supabase/functions/dwd-weather-history/index.test.ts
