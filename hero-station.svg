<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#071018"/><stop offset=".45" stop-color="#29313a"/><stop offset=".78" stop-color="#d66b2b"/><stop offset="1" stop-color="#ff9b3d"/></linearGradient>
 <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#202326"/><stop offset="1" stop-color="#050709"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#20343c"/><stop offset="1" stop-color="#101a20"/></linearGradient>
 <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171d21"/><stop offset="1" stop-color="#050607"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff2c1"/><stop offset=".35" stop-color="#ffb34c"/><stop offset="1" stop-color="#ff7b24" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1200" height="900" fill="url(#sky)"/>
<circle cx="935" cy="285" r="170" fill="url(#sun)" filter="url(#blur)"/>
