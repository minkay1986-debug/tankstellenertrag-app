<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TankstellenErtrag · Auswertung</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script>
<style>:root{--bg:#0d0f10;--p:#181c1f;--p2:#23282c;--l:#353c41;--t:#f5f6f7;--m:#aeb6bc;--o:#f47b20;--g:#45c477;--y:#f0bd4f;--r:#ef6461;--in:#fff1e7}*{box-sizing:border-box}body{margin:0;background:#0d0f10;color:var(--t);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1400px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:23px;font-weight:900}.brand span{color:var(--o)}.pill{padding:7px 11px;border:1px solid #4b3a2b;border-radius:999px;color:#ffc08b;background:#211b16;font-size:12px}.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(5,1fr)}.card,.panel{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:18px}.label{font-size:12px;color:var(--m)}.value{font-size:24px;font-weight:900;margin-top:7px}.small{font-size:12px;color:var(--m);line-height:1.5}.ok{border-color:#285c42;background:#17271f}.warn{border-color:#5a482b;background:#24201a}.danger{border-color:#673535;background:#2b1c1c}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.nav button,.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.nav button{background:#30363a;color:#fff}.nav button.active,.primary{background:var(--o);color:#fff}.secondary{background:#30363a;color:#fff}.view{display:none}.view.active{display:block}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field label{display:block;font-size:12px;color:var(--m);margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border-radius:8px;border:1px solid #d9c1b1;background:var(--in);color:#171717}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--l);text-align:left;font-size:13px}th{color:var(--m)}@media(max-width:1000px){.cards,.form{grid-template-columns:1fr 1fr}}@media(max-width:650px){.wrap{padding:14px}.cards,.form{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}}</style></head><body><div class="wrap">
<header class="top"><div class="brand">Tankstellen<span>Ertrag</span></div><div class="pill">Geschützte Auswertung · Gründungspartner</div></header>
<div id="gate" class="panel">Verbindung zur Station wird hergestellt …</div>
<div id="app" style="display:none">
<div id="stationInfo" class="panel" style="margin-bottom:14px"></div>
<nav class="nav"><button class="active" data-v="dashboard">Übersicht</button><button data-v="monthly">Monatsdaten</button><button data-v="analysis">Analyse</button><button data-v="report">Bericht</button><button id="back" class="secondary">Kundenkonto</button></nav>
<section id="dashboard" class="view active"><div id="kpis" class="grid cards"></div><div id="alerts" class="panel" style="margin-top:14px"></div></section>
<section id="monthly" class="view"><div class="panel"><h2>Monatsdaten</h2><div class="form"><div class="field"><label>Monat</label><input id="month" type="month"></div><div class="field"><label>Shop-Umsatz €</label><input id="rev" type="number" step="0.01"></div><div class="field"><label>Shop-EK €</label><input id="ek" type="number" step="0.01"></div><div class="field"><label>Schwund €</label><input id="shrink" type="number" step="0.01"></div></div><h3>Warengruppen</h3><div id="groups"></div><div class="actions"><button id="save" class="btn primary">Monat speichern</button><button id="load" class="btn secondary">Cloud-Daten neu laden</button></div><div id="msg" class="small" style="margin-top:10px"></div></div></section>
<section id="analysis" class="view"><div class="panel"><h2>Analyse</h2><div id="analysisBody"></div></div></section>
<section id="report" class="view"><div class="panel"><h2>Beratungsbericht · Kurzfassung</h2><div id="reportBody"></div></div></section>
</div></div>
<script>
const cfg=window.TANKSTELLENERTRAG_SUPABASE||{};const sb=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});let station=null,snap=null;
const groups=['Süßwaren','Backshop','Kaffee','Drogerie','Lebensmittel','Spielzeug','Waschen','Getränke','Eis'];
const $=id=>document.getElementById(id);const eur=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(n)||0);const pct=n=>(Number(n)||0).toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})+' %';
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function empty(){return {schemaVersion:1,appVersion:'43.19-cloud-core',months:{}}}function current(){return $('month').value||new Date().toISOString().slice(0,7)}
function row(){snap.months[current()]??={revenue:0,ek:0,shrink:0,groups:{}};return snap.months[current()]}
function renderGroups(){const r=row();$('groups').innerHTML='<div class="form">'+groups.map(g=>'<div class="field"><label>'+g+' · Umsatz €</label><input data-g="'+g+'" type="number" step="0.01" value="'+Number(r.groups[g]||0)+'"></div>').join('')+'</div>'}
function render(){const r=row(),rev=Number(r.revenue),ek=Number(r.ek),gross=rev-ek,margin=rev?gross/rev*100:0,sh=rev?Number(r.shrink)/rev*100:0;$('kpis').innerHTML=[['Shop-Umsatz',eur(rev)],['Shop-EK',eur(ek)],['Rohertrag',eur(gross)],['Shop-Marge',pct(margin)],['Schwundquote',pct(sh)]].map(x=>'<div class="card"><div class="label">'+x[0]+'</div><div class="value">'+x[1]+'</div></div>').join('');$('alerts').innerHTML=margin<20?'<div class="panel warn"><b>Prüfsignal: niedrige Shop-Marge</b><div class="small">Die gemessene Marge liegt unter 20 %. Ursache muss anhand EK, Preisstellung, Warenmix und Monatsabgrenzung geprüft werden.</div></div>':'<div class="panel ok"><b>Keine harte Margenwarnung im Testmonat.</b><div class="small">Die Kennzahl ist eine rechnerische Einordnung und ersetzt keine Ursachenprüfung.</div></div>';const rows=groups.map(g=>{const v=Number(r.groups[g]||0);return '<tr><td>'+g+'</td><td>'+eur(v)+'</td></tr>'}).join('');$('analysisBody').innerHTML='<p class="small">Monat: '+esc(current())+'</p><table><thead><tr><th>Warengruppe</th><th>Umsatz</th></tr></thead><tbody>'+rows+'</tbody></table>';$('reportBody').innerHTML='<p><b>Stationsdaten:</b> '+esc(station.station_name)+' · '+esc(station.postcode)+' '+esc(station.city)+'</p><p><b>Monatswert:</b> '+esc(current())+'</p><p><b>Shop-Umsatz:</b> '+eur(rev)+' · <b>Shop-EK:</b> '+eur(ek)+' · <b>Rohertrag:</b> '+eur(gross)+' · <b>Marge:</b> '+pct(margin)+'</p><p>Die Zahlen bilden die aktuelle Cloud-Auswertung ab. Auffälligkeiten sind als Prüfsignale zu verstehen; konkrete Ursachen werden erst nach Prüfung der HUTH-Daten und betrieblichen Abläufe festgelegt.</p>';renderGroups()}
async function load(){const {data:u,error:ue}=await sb.auth.getUser();if(ue||!u.user){location.href='./';return}const {data:s,error:se}=await sb.from('stations').select('*').eq('owner_id',u.user.id).maybeSingle();if(se||!s)throw new Error('Keine freigeschaltete Station gefunden.');station=s;const active=s.subscription_status==='active'||(s.subscription_status==='trial'&&new Date(s.trial_ends_at)>new Date())||(s.subscription_status==='founding_partner'&&new Date(s.founding_partner_free_until)>new Date());if(!active)throw new Error('Der Zugang ist nicht aktiv.');const {data:x,error:xe}=await sb.from('station_snapshots').select('payload,updated_at').eq('station_id',s.id).maybeSingle();if(xe)throw xe;snap=x?.payload&&typeof x.payload==='object'?x.payload:empty();snap.months=snap.months||{};$('stationInfo').innerHTML='<b>'+esc(s.station_name)+'</b><div class="small">'+esc(s.postcode)+' '+esc(s.city)+' · Zugang: '+esc(s.subscription_status)+' · bis '+new Date(s.founding_partner_free_until||s.subscription_ends_at||s.trial_ends_at).toLocaleDateString('de-DE')+'</div>';const m=new Date().toISOString().slice(0,7);$('month').value=Object.keys(snap.months)[0]||m;render();$('gate').style.display='none';$('app').style.display='block'}
$('month').addEventListener('change',render);$('save').onclick=async()=>{try{const r=row();r.revenue=Number($('rev').value)||0;r.ek=Number($('ek').value)||0;r.shrink=Number($('shrink').value)||0;document.querySelectorAll('[data-g]').forEach(i=>r.groups[i.dataset.g]=Number(i.value)||0);const {error}=await sb.from('station_snapshots').upsert({station_id:station.id,schema_version:1,app_version:'43.19-cloud-core',payload:snap},{onConflict:'station_id'});if(error)throw error;$('msg').textContent='Monat erfolgreich in der Cloud gespeichert.';render()}catch(e){$('msg').textContent='Fehler: '+(e.message||e)}};
$('load').onclick=()=>location.reload();$('back').onclick=()=>location.href='./';document.querySelectorAll('.nav button[data-v]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button[data-v]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(b.dataset.v).classList.add('active');render()});load().catch(e=>{$('gate').className='panel danger';$('gate').textContent=e.message||String(e)});
</script></body></html>
