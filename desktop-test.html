<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TankstellenErtrag – isolierter Desktop-Test</title><style>body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:24px;color:#222}.box{max-width:760px;margin:40px auto;background:#fff;padding:24px;border-radius:14px;box-shadow:0 8px 30px #0001}.ok{color:#176b35}.err{color:#9b1c1c}code{word-break:break-all}</style></head><body><div class="box" id="status">Isolierter Teststand wird geladen …</div><script>(async()=>{const el=document.getElementById('status');try{const r=await fetch('https://raw.githubusercontent.com/minkay1986-debug/tankstellenertrag-app/test-desktop-stabilisierung-20261007/analyse.html',{cache:'no-store'});if(!r.ok)throw new Error('Testversion konnte nicht geladen werden (HTTP '+r.status+').');const h=await r.text();document.open();document.write(h);document.close()}catch(e){el.className='box err';el.innerHTML='<strong>Teststand konnte nicht geladen werden.</strong><br><br>'+String(e.message||e)+'<br><br><code>Origin: '+location.origin+'</code>'}})();</script></body></html>
