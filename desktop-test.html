<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TankstellenErtrag · Desktop-Test</title>
<style>
html,body{margin:0;min-height:100%;background:#0d0f10;color:#fff;font-family:system-ui,sans-serif}
#status{padding:18px;text-align:center;color:#aeb6bc;line-height:1.6}
#status strong{color:#f47b20}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="status"><strong>TESTVERSION</strong><br>Desktop-Test wird geladen …</div>
<script>
(async()=>{
  const status=document.getElementById('status');
  const raw='https://raw.githubusercontent.com/minkay1986-debug/tankstellenertrag-app/test-desktop-stabilisierung-20261007/analyse.html?test=20261007';
  try{
    const client=window.supabase.createClient(
      'https://irzlbdybtrbztjjkrlad.supabase.co',
      'sb_publishable_IcdCc5Wd-coYOLyHl_XBuQ_4FcEyv-1',
      {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'tankstellenertrag-auth',storage:window.localStorage}}
    );
    const {data,error}=await client.auth.getSession();
    if(error)throw error;
    if(!data?.session){
      status.innerHTML='<strong>TESTVERSION – keine aktive Anmeldung gefunden</strong><br>Origin: '+location.origin+'<br>Session-Speicher: '+(localStorage.getItem('tankstellenertrag-auth')?'vorhanden':'nicht vorhanden')+'<br><br>Bitte zuerst auf der normalen Plattform anmelden und danach diesen Test erneut öffnen.';
      return;
    }
    localStorage.setItem('tankstellenertrag-session-handoff',JSON.stringify({
      access_token:data.session.access_token,
      refresh_token:data.session.refresh_token,
      created_at:Date.now()
    }));
    status.innerHTML='<strong>TESTVERSION – Sitzung gefunden ✓</strong><br>Übergabe an die isolierte Desktop-Version wird vorbereitet …';
    const r=await fetch(raw,{cache:'no-store'});
    if(!r.ok)throw new Error('Testversion konnte nicht geladen werden ('+r.status+').');
    const html=await r.text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    status.innerHTML='<strong>Testversion konnte nicht geladen werden</strong><br>'+String(e.message||e);
  }
})();
</script>
</body>
</html>
